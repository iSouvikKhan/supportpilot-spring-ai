server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Local models can take a while to answer, especially with tool calls.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
